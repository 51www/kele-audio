<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="kele-audio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB347"/>
      <stop offset="0.55" stop-color="#FF8A5B"/>
      <stop offset="1" stop-color="#FF6B9D"/>
    </linearGradient>
    <linearGradient id="cup" x1="120" y1="250" x2="392" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A2A4D"/>
      <stop offset="1" stop-color="#241A33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded app tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>

  <!-- headphone band -->
  <path d="M150 296 V258 a106 106 0 0 1 212 0 V296"
        stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" fill="none"/>

  <!-- left ear cup -->
  <rect x="124" y="288" width="66" height="116" rx="30" fill="url(#cup)"/>
  <rect x="138" y="306" width="38" height="80" rx="19" fill="#FF8A5B"/>

  <!-- right ear cup -->
  <rect x="322" y="288" width="66" height="116" rx="30" fill="url(#cup)"/>
  <rect x="336" y="306" width="38" height="80" rx="19" fill="#FFB347"/>

  <!-- sound waves (right) -->
  <path d="M404 250 q24 12 24 36 q0 24 -24 36" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.95"/>
  <path d="M420 226 q40 20 40 60 q0 40 -40 60" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- music note (left) -->
  <g fill="#FFFFFF">
    <circle cx="92" cy="190" r="16"/>
    <rect x="104" y="120" width="10" height="74" rx="5"/>
    <path d="M104 120 q26 6 26 28 q-8 -14 -26 -10 Z"/>
  </g>
</svg>
